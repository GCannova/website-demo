<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Player</title>

  <style>
    body {
      margin: 0;
      background: #111;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: 0;
    }
  </style>
</head>
<body>

  <iframe
    src="https://www.youtube.com/embed/RIYS3KWtbTs?autoplay=1"
    title="YouTube audio player"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>

</body>
</html>
